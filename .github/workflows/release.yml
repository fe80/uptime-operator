name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0). Must already exist in the repo."
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  image:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.value }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          REF: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$REF' must match v<major>.<minor>.<patch>[-prerelease]"
            exit 1
          fi
          version="${REF#v}"
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'image=%s/%s:%s\n' "$REGISTRY" "$IMAGE_NAME" "$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        env:
          IS_STABLE: ${{ !contains(steps.version.outputs.value, '-') }}
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.value }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.value }},enable=${{ env.IS_STABLE }}
          flavor: |
            latest=${{ env.IS_STABLE }}

      - name: Build and push image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  chart:
    name: Package and publish chart
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.16.4

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Render install.yaml
        env:
          IMG: ${{ needs.image.outputs.image }}
        run: make build-installer

      - name: Lint chart
        run: helm lint ./dist/chart

      - name: Package chart
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          mkdir -p dist/release
          helm package ./dist/chart \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist/release

      - name: Push chart to GHCR
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          helm push "dist/release/uptime-operator-${VERSION}.tgz" "$CHART_REPO"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: v${{ needs.image.outputs.version }}
          name: v${{ needs.image.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.image.outputs.version, '-') }}
          make_latest: ${{ !contains(needs.image.outputs.version, '-') }}
          files: |
            dist/install.yaml
            dist/release/uptime-operator-${{ needs.image.outputs.version }}.tgz
