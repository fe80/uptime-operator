# This rule is not used by the project uptime-k8s-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over monitoring.uptime.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: uptime-k8s-operator
    app.kubernetes.io/managed-by: kustomize
  name: uptimecheck-admin-role
rules:
- apiGroups:
  - monitoring.uptime.com
  resources:
  - uptimechecks
  verbs:
  - '*'
- apiGroups:
  - monitoring.uptime.com
  resources:
  - uptimechecks/status
  verbs:
  - get
