# This rule is not used by the project uptime-k8s-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the monitoring.uptime.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: uptime-k8s-operator
    app.kubernetes.io/managed-by: kustomize
  name: uptimecheck-editor-role
rules:
- apiGroups:
  - monitoring.uptime.com
  resources:
  - uptimechecks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - monitoring.uptime.com
  resources:
  - uptimechecks/status
  verbs:
  - get
